        box-shadow: 7px 6px 8px burlywood;

        width: 500px;
        box-shadow: 5px 7px 8px red;
    }
    .d_shadow2{
         width: 500px;
         filter: drop-shadow(5px 7px 8px black);

    }

<body>

    <img src="images/images.png" class="d_shadow2"/>

    <img class="b_shadow" src="images/images.jpeg" alt="..."/>

    <img class="b_shadow2" src="images/images.png" alt="..."/>
